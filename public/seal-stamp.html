<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seal Stamp Generator</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #f1f5f9;
            color: #111827;
            font-family: Arial, Helvetica, sans-serif;
        }

        .page {
            width: min(960px, calc(100% - 32px));
            margin: 0 auto;
            padding: 32px 0;
        }

        .card {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            box-shadow: 0 10px 28px rgba(15, 23, 42, 0.08);
            overflow: hidden;
        }

        .card-header {
            padding: 22px 24px;
            background: #011f49;
            color: #fff;
        }

        .card-header h1 {
            margin: 0;
            font-size: 24px;
        }

        .card-header p {
            margin: 8px 0 0;
            color: #dbeafe;
            font-size: 14px;
        }

        .content {
            display: grid;
            grid-template-columns: minmax(260px, 1fr) minmax(260px, 1fr);
            gap: 28px;
            padding: 24px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #374151;
            font-size: 14px;
            font-weight: 700;
        }

        input {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
        }

        .field {
            margin-bottom: 18px;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 22px;
        }

        button,
        .back-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 40px;
            padding: 0 16px;
            border-radius: 8px;
            border: 0;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
        }

        .primary-button {
            background: #011f49;
            color: #fff;
        }

        .secondary-button,
        .back-link {
            background: #e5e7eb;
            color: #111827;
        }

        .preview-panel {
            display: grid;
            place-items: center;
            padding: 24px;
            border: 1px dashed #cbd5e1;
            border-radius: 10px;
            background: #f8fafc;
        }

        canvas {
            width: 300px;
            height: 300px;
            max-width: 100%;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 8px 18px rgba(15, 23, 42, 0.12);
        }

        .hint {
            margin: 14px 0 0;
            color: #64748b;
            font-size: 13px;
            text-align: center;
        }

        @media (max-width: 760px) {
            .content {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <main class="page">
        <section class="card">
            <div class="card-header">
                <h1>Seal Stamp Generator</h1>
                <p>Enter certificate details, preview the seal stamp, then download it as an image.</p>
            </div>
            <div class="content">
                <form id="seal-form">
                    <div class="field">
                        <label for="certificate-number">Certificate Number</label>
                        <input id="certificate-number" type="text" placeholder="F25111164554" required>
                    </div>
                    <div class="field">
                        <label for="certificate-date">Certificate Date</label>
                        <input id="certificate-date" type="date" required>
                    </div>
                    <div class="actions">
                        <button class="primary-button" id="download-button" type="button">Download PNG</button>
                        <a class="back-link" href="/dashboard">Back to Dashboard</a>
                    </div>
                </form>

                <div>
                    <div class="preview-panel">
                        <canvas id="seal-canvas" width="600" height="600" aria-label="Seal stamp preview"></canvas>
                    </div>
                    <p class="hint">The downloaded image uses the same seal asset and text placement as the certificate template.</p>
                </div>
            </div>
        </section>
    </main>

    <script>
        const canvas = document.getElementById('seal-canvas');
        const context = canvas.getContext('2d');
        const certificateNumberInput = document.getElementById('certificate-number');
        const certificateDateInput = document.getElementById('certificate-date');
        const sealImage = new Image();
        const scale = canvas.width / 150;

        sealImage.crossOrigin = 'anonymous';
        sealImage.src = '/assets/smalllogoomanchamber.jpg';

        function formatDate(dateValue) {
            if (!dateValue) return '';

            const [year, month, day] = dateValue.split('-');
            return `${day}/${month}/${year}`;
        }

        function drawCenteredText(text, x, y) {
            context.fillText(text, x * scale, y * scale);
        }

        function renderSeal() {
            context.clearRect(0, 0, canvas.width, canvas.height);
            context.drawImage(sealImage, 0, 0, canvas.width, canvas.height);

            context.fillStyle = '#041643';
            context.font = `${7 * scale}px Arial, Helvetica, sans-serif`;
            context.textAlign = 'center';
            context.textBaseline = 'middle';

            drawCenteredText(certificateNumberInput.value.trim(), 28, 81);
            drawCenteredText(formatDate(certificateDateInput.value), 128, 80);
        }

        document.getElementById('download-button').addEventListener('click', () => {
            renderSeal();

            const link = document.createElement('a');
            const safeNumber = certificateNumberInput.value.trim().replace(/[^a-zA-Z0-9._-]/g, '_') || 'seal-stamp';
            link.download = `${safeNumber}-seal-stamp.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        });

        certificateNumberInput.addEventListener('input', renderSeal);
        certificateDateInput.addEventListener('input', renderSeal);
        sealImage.addEventListener('load', renderSeal);
        sealImage.addEventListener('error', () => {
            context.fillStyle = '#b91c1c';
            context.font = '18px Arial, Helvetica, sans-serif';
            context.textAlign = 'center';
            context.fillText('Unable to load seal image', canvas.width / 2, canvas.height / 2);
        });
    </script>
</body>
</html>
